name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers on v1.0.0, v2.1.3, etc.

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: Transcriber-Windows.zip
            dist_path: dist/Transcriber
          - os: macos-latest
            artifact_name: Transcriber-macOS.zip
            dist_path: dist/Transcriber.app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      - name: Install System Dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install portaudio

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 sounddevice numpy pynput requests Pillow pyinstaller keyboard

      - name: Build Application (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon="transcriber_logo.ico" --name="Transcriber" --hidden-import="keyboard" src/main.py

      - name: Build Application (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # Convert icon to ICNS for macOS or just build with standard options
          pyinstaller --noconfirm --onedir --windowed --name="Transcriber" --hidden-import="keyboard" src/main.py

      - name: Create Release Artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          compress-archive -path ${{ matrix.dist_path }} -destinationpath ${{ matrix.artifact_name }}

      - name: Create Release Artifact (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          zip -r ${{ matrix.artifact_name }} ${{ matrix.dist_path }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Transcriber-Windows.zip

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: Transcriber-macOS.zip

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Transcriber-Windows.zip
            Transcriber-macOS.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
